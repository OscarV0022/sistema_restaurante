<div class="kds-layout">
  <!-- BARRA SUPERIOR -->
  <header class="kds-header">
    <div class="brand">
      <mat-icon>restaurant_menu</mat-icon>
      <h1>Cocina - La Chiantlequita</h1>
    </div>
    
    <div class="controles-superiores">
      <!-- Botón de activar audio (Llama la atención si está apagado) -->
      <button mat-flat-button color="warn" class="btn-activar-audio" (click)="activarAudio()" *ngIf="!audioHabilitado">
        <mat-icon>volume_up</mat-icon> <span>Activar Sonido</span>
      </button>
      
      <!-- Indicador verde cuando el audio ya sirve -->
      <div class="audio-activo" *ngIf="audioHabilitado">
        <mat-icon>hearing</mat-icon> <span>Audio Listo</span>
      </div>

      <button mat-fab extended color="primary" class="btn-pos" (click)="irAlPos()" matTooltip="Regresar al POS">
        <mat-icon>point_of_sale</mat-icon> Punto de Venta
      </button>
    </div>
  </header>

  <!-- CONTENEDOR DE TICKETS -->
  <main class="kds-main">
    
    <!-- PANTALLA VACÍA -->
    <div *ngIf="tickets.length === 0" class="sin-pedidos">
      <mat-icon class="icono-vacio">outdoor_grill</mat-icon>
      <h2>¡Cocina al día!</h2>
      <p>No hay pedidos pendientes en este momento.</p>
    </div>

    <!-- CUADRÍCULA DE TICKETS (GRID) -->
    <div class="kds-grid" *ngIf="tickets.length > 0">
      
      <!-- CADA TICKET -->
      <div class="ticket-card" 
           *ngFor="let ticket of tickets" 
           [ngClass]="'estado-' + ticket.estado">
        
        <!-- CABECERA DEL TICKET -->
        <div class="ticket-header">
          <div class="info-mesa">
            <h2>{{ ticket.mesa }}</h2>
            <div class="mesero">
              <mat-icon>person</mat-icon> 
              <span>{{ ticket.atendidoPor || 'Personal' }}</span>
            </div>
          </div>
          
          <div class="controles-ticket">
            <!-- Botón de voz para la abuela -->
            <button mat-mini-fab class="btn-leer-abuela" (click)="leerPedidoManual(ticket)" matTooltip="Leer en voz alta">
              <mat-icon>volume_up</mat-icon>
            </button>
            <!-- Botón de minimizar -->
            <button mat-icon-button class="btn-minimizar" (click)="toggleMinimizar(ticket)">
              <mat-icon>{{ ticket.minimizado ? 'expand_more' : 'expand_less' }}</mat-icon>
            </button>
          </div>
        </div>

        <!-- CUERPO DEL TICKET (Oculto si está minimizado) -->
        <div class="ticket-body" *ngIf="!ticket.minimizado">
          <div class="etiqueta-estado" [ngClass]="ticket.estado">
            {{ ticket.estado | uppercase }}
          </div>

          <ul class="lista-productos">
            <li *ngFor="let item of ticket.detalles">
              <!-- Cantidad gigante para fácil lectura -->
              <div class="cantidad-caja">{{ item.cantidad }}</div>
              <div class="descripcion-texto">{{ item.descripcion }}</div>
            </li>
          </ul>
        </div>

        <!-- ACCIONES DEL TICKET (Oculto si está minimizado) -->
        <div class="ticket-footer" *ngIf="!ticket.minimizado">
          <button class="btn-accion btn-preparar" 
                  *ngIf="ticket.estado === 'pendientes'" 
                  (click)="cambiarEstado(ticket, 'preparando')">
            <mat-icon>soup_kitchen</mat-icon> PREPARAR
          </button>
          
          <button class="btn-accion btn-completar" 
                  *ngIf="ticket.estado === 'preparando'" 
                  (click)="cambiarEstado(ticket, 'completo')">
            <mat-icon>done_all</mat-icon> ¡LISTO!
          </button>
        </div>

      </div> <!-- Fin de ticket-card -->
    </div> <!-- Fin de kds-grid -->

  </main>
</div>
