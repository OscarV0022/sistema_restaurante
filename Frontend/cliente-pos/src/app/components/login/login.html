<div class="login-container">
  <div class="login-card">
    <h2>Inicio de Sesión</h2>
    <p class="subtitle">Sistema de Restaurante</p>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" [(ngModel)]="loginData.username" name="username" required placeholder="Ej: admin">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" [(ngModel)]="loginData.password" name="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn-login">Entrar al Sistema</button>
      
      <p *ngIf="error" class="error-msg">{{ error }}</p>
    </form>
  </div>
</div>
